<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DUT Craft · 选择服务器</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- 防 FOUC：在样式应用前根据存储/系统偏好锁定主题（与 theme.ts 共用 key "dutcraft-theme"） -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("dutcraft-theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = stored === "light" || stored === "dark" ? stored : prefersLight ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <!-- 背景层：替换 assets/backgrounds/night.png / day.png 即可换背景（说明见 AGENTS.md） -->
    <div class="backdrop" aria-hidden="true"></div>

    <main class="screen">
      <!-- 配置提示：servers.json 加载失败或含无效条目时由 main.ts 填充 -->
      <div id="config-banner" class="mc-notice" hidden></div>

      <header class="screen-head">
        <div class="screen-head-main">
          <p class="screen-over">DUT CRAFT · MULTIPLAYER</p>
          <h1 class="screen-title">选择服务器</h1>
        </div>
        <!-- MC 物品提示框样式的状态条 -->
        <div class="mc-tip" role="timer">
          <span id="clock-time">--:--:--</span>
          <span class="tip-sep">·</span>
          <span><b id="stat-online">--</b>/<b id="stat-units">--</b> 在线</span>
          <span class="tip-sep">·</span>
          <span><b id="stat-players">--</b> 位玩家</span>
        </div>
      </header>

      <section class="server-list" id="status-board" aria-live="polite"></section>

      <footer class="screen-actions">
        <span id="last-sync" class="last-sync">上次同步 --:--:--</span>
        <div class="action-btns">
          <button id="theme-toggle" class="mc-btn" type="button" aria-label="切换明暗主题" title="切换明暗主题">
            ◐ <span id="shift-name">夜晚</span>
          </button>
          <button id="refresh-all" class="mc-btn mc-btn-primary" type="button" aria-label="刷新所有服务器状态">刷新</button>
        </div>
      </footer>

      <footer class="page-foot">
        <span>数据来自 api.mcsrvstat.us · 约有数分钟缓存</span>
        <span>GUI 材质取自 Minecraft 客户端，版权归 Mojang / Microsoft 所有 · 非官方 Minecraft 站点</span>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
